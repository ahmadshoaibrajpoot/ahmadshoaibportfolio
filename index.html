<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmad Shoaib — Senior UI/UX Designer</title>
<meta name="description" content="Ahmad Shoaib, Senior UI/UX Designer and UX Engineer. SaaS, fintech and mobile products from research to shipped UI and design systems.">
<meta name="theme-color" content="#0A0A0B">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app"></div>

<!-- Page template: rendered by js/dc-lite.js using the values from js/main.js -->
<script type="text/x-template" id="dc-template">
<div class="{{rootCls}}" ref="{{ rootRef }}" style="--accent: {{accent}}; background: #0A0A0B; color: #EDEDEE; font-family: Manrope, system-ui, sans-serif; min-height: 100vh; overflow-x: clip">

  <!-- LOADER -->
  <div class="ldr" aria-hidden="true" ref="{{ ldrBarRef }}">
    <div class="ldr-top ldr-in"><span><i class="ldr-dot"></i>AHMAD SHOAIB</span><span>DESIGNING YOUR VIEW</span></div>
    <div class="ldr-stage">
      <div class="ldr-meta ldr-in"><span>#&nbsp;Home / Portfolio</span><span>1440 × 900 · Auto layout</span></div>
      <div class="ldr-frame">
        <div class="lb lb-nav" style="--t:.04"><i></i></div>
        <div class="lb lb-k" style="--t:.12"><i></i></div>
        <div class="lb lb-h" style="--t:.2"><i></i><span>AHMAD SHOAIB</span></div>
        <div class="lb lb-img" style="--t:.3"><i></i></div>
        <div class="lb lb-s" style="--t:.38"><i></i></div>
        <div class="lb lb-s2" style="--t:.44"><i></i></div>
        <div class="lb lb-btn" style="--t:.52"><i></i></div>
        <div class="lb lb-c lb-c1" style="--t:.6"><i></i></div>
        <div class="lb lb-c lb-c2" style="--t:.66"><i></i></div>
        <div class="lb lb-c lb-c3" style="--t:.72"><i></i></div>
        <div class="ldr-sel"><b></b><b></b><b></b><b></b></div>
        <span class="ldr-cur"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 1l5.5 13.5 2-5.5 5.5-2z" fill="currentColor" stroke="#0A0A0B" stroke-width="1"></path></svg><em>Ahmad</em></span>
      </div>
      <ol class="ldr-steps ldr-in">
        <li style="--t:0"><small>01</small>Research</li>
        <li style="--t:.25"><small>02</small>Wireframe</li>
        <li style="--t:.5"><small>03</small>Interface</li>
        <li style="--t:.75"><small>04</small>Ship</li>
      </ol>
    </div>
    <div class="ldr-bot ldr-in"><div class="ldr-num"><b ref="{{ ldrNumRef }}">000</b><sup>%</sup></div><p><span>SENIOR UI/UX DESIGNER</span><br>PORTFOLIO · 2026</p></div>
  </div>

  <!-- NAV -->
  <span id="top"></span>
  <!-- TOP BAR -->
  <header class="hi" style="--d: .55s; position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; mix-blend-mode: difference; pointer-events: none">
    <a href="#top" onClick="{{ closeMenu }}" style="pointer-events: auto; display: inline-flex; align-items: center; min-height: 44px; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; letter-spacing: .02em; line-height: 1; color: #EDEDEE; text-decoration: none">AHMAD SHOAIB</a>
    <button aria-expanded="{{ menuExpanded }}" aria-controls="site-menu" onClick="{{ toggleMenu }}" style="pointer-events: auto; min-height: 44px; padding: 0; background: none; border: none; color: #EDEDEE; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; display: inline-flex; align-items: center; gap: 14px; cursor: pointer">
      {{ menuLabel }}
      <span aria-hidden="true" style="display: inline-flex; flex-direction: column; gap: 6px; width: 26px">
        <span class="bar1" style="display: block; height: 2px; background: currentColor"></span>
        <span class="bar2" style="display: block; height: 2px; background: currentColor"></span>
      </span>
    </button>
  </header>

  <!-- FULL-SCREEN MENU -->
  <div class="ov" id="site-menu">
    <nav aria-label="Main" style="min-height: 100%; box-sizing: border-box; padding: 104px 28px 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
      <ul style="margin: 0; padding: 0; list-style: none">
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="6">
          <li class="mi" style="display: flex; align-items: baseline; gap: 22px; transition-delay: {{ m.delay }}">
            <span style="flex: 0 0 22px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .1em; color: #66666D">{{ m.num }}</span>
            <a class="ml" href="{{ m.href }}" onClick="{{ closeMenu }}" style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: clamp(54px, 11.5vh, 128px); line-height: .92; letter-spacing: .005em">{{ m.label }}</a>
          </li>
        </sc-for>
      </ul>
      <div class="mi" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 48px; padding-left: 44px; transition-delay: .5s">
        <div style="display: flex; flex-wrap: wrap; gap: 0 28px">
          <sc-for list="{{ menu2 }}" as="m" hint-placeholder-count="4">
            <a class="ml sl" href="{{ m.href }}" onClick="{{ closeMenu }}" style="display: inline-flex; align-items: center; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .2em">{{ m.label }}</a>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 0 28px">
          <sc-for list="{{ socials }}" as="so" hint-placeholder-count="3">
            <a class="ml sl" href="{{ so.url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase">{{ so.label }}
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
            </a>
          </sc-for>
          <a class="ml sl" href="assets/Ahmad-Shoaib-Resume.pdf" download="Ahmad_Shoaib_CV.pdf" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase">Résumé
            <svg class="dli" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg>
          </a>
        </div>
      </div>
    </nav>
  </div>

  <!-- SECTION RAIL -->
  <div class="rail" aria-hidden="true" style="position: fixed; right: 26px; top: 84px; bottom: 22px; width: 1px; background: #2C2C30; z-index: 80; pointer-events: none">
    <sc-for list="{{ ticks }}" as="tk" hint-placeholder-count="11">
      <span style="position: absolute; right: 0; top: {{ tk.top }}; width: 8px; height: 1px; background: #55555C"></span>
    </sc-for>
    <div ref="{{ dotRef }}" style="position: absolute; right: -4px; top: 0%; width: 9px; height: 9px; margin-top: -4px; border-radius: 50%; background: {{accent}}">
      <span style="position: absolute; right: 22px; top: -13px; text-align: right; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.9; letter-spacing: .2em; color: #85858C">{{ secNum }}<br><span style="color: #EDEDEE">{{ secName }}</span></span>
      <span style="position: absolute; right: 9px; top: 4px; width: 8px; height: 1px; background: {{accent}}"></span>
    </div>
  </div>


  <!-- HERO -->
  <section onPointerMove="{{ onHeroMove }}" onPointerLeave="{{ onHeroLeave }}" style="position: relative; min-height: min(100vh, 920px); padding: 120px 24px 44px; box-sizing: border-box; overflow: hidden; background: #0A0A0B; display: flex; flex-direction: column">
    <!-- Interactive mesh background -->
    <canvas ref="{{ meshRef }}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0"></canvas>

    <!-- HUD marks -->
    <div class="hud hi" aria-hidden="true" style="--d: .9s; position: absolute; inset: 0; pointer-events: none; z-index: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; color: #55555C">
      <span style="position: absolute; left: clamp(24px, 5vw, 96px); top: 112px">PORTFOLIO · 2026</span>
      <span style="position: absolute; right: clamp(56px, 6vw, 110px); top: 112px">ISLAMABAD · UTC+5</span>
    </div>

    <!-- Name -->
    <div style="position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 56px 0 72px">
      <div style="position: relative; display: inline-block; max-width: 100%">
        <h1 class="nm" aria-label="Ahmad Shoaib" style="margin: 0; font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: clamp(60px, 17.6vw, 316px); line-height: .86; letter-spacing: .004em; color: #EDEDEE; white-space: nowrap; text-align: center"><sc-for list="{{ nameChars }}" as="c" hint-placeholder-count="12"><span class="ch" aria-hidden="true"><span class="ch-i" style="--d: {{ c.d }}"><span class="ch-r" style="--rd: {{ c.rd }}">{{ c.ch }}<span class="ch-b">{{ c.ch }}</span></span></span></span></sc-for></h1>

        <!-- signature line -->
        <svg class="draw" aria-hidden="true" viewBox="0 0 1000 345" preserveAspectRatio="none" style="position: absolute; left: -7%; top: 0; width: 114%; height: 150%; overflow: visible; pointer-events: none; mix-blend-mode: difference">
          <path d="M 190 212 C 120 250, 22 300, 15 320" fill="none" stroke="#66666D" stroke-width="1" vector-effect="non-scaling-stroke"></path>
          <path d="M 15 320 C 10 336, 300 290, 560 228 S 900 158, 1000 155" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        </svg>
      </div>
    </div>

    <!-- Intro + scroll cue -->
    <div style="position: relative; z-index: 1; width: 100%; max-width: 1560px; margin: 0 auto; padding: 0 clamp(0px, 5vw, 96px); box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px 48px">
      <div style="max-width: 440px">
        <p class="hi" style="--d: 1.05s; margin: 0 0 14px; display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .2em; color: #EDEDEE"><span class="blink" style="width: 7px; height: 7px; border-radius: 50%; background: #3DDC84"></span>OPEN TO SENIOR PRODUCT DESIGN ROLES</p>
        <span class="gp up hi" aria-hidden="true" style="--g: 14px; --d: 2.1s"><b>14</b></span>
        <p class="hi" style="--d: 1.15s; margin: 0 0 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .22em; color: #85858C">SENIOR UI/UX DESIGNER · UX ENGINEER · 6+ YEARS</p>
        <span class="gp up hi" aria-hidden="true" style="--g: 12px; --d: 2.1s"><b>12</b></span>
        <p class="hi" style="--d: 1.25s; margin: 0; font-size: 18px; line-height: 1.6; color: #DCDCE0">I design SaaS, fintech and mobile products end to end, from research to shipped UI and design systems, and I build in Webflow and Framer so designs ship the way they were drawn.</p>
        <span class="gp dn hi" aria-hidden="true" style="--g: 22px; --d: 2.1s"><b>22</b></span>
        <p class="hero-links hi" style="--d: 1.35s; margin: 22px 0 0; display: flex; flex-wrap: wrap; gap: 8px; width: max-content; max-width: calc(100vw - 48px)">
          <sc-for list="{{ socials }}" as="so" hint-placeholder-count="3">
            <a class="hl" href="{{ so.url }}" target="_blank" rel="noopener" aria-label="{{ so.aria }}"><svg class="si" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ so.icon }}"></path></svg><span>{{ so.label }}</span></a>
          </sc-for>
          <a class="hl cv" href="assets/Ahmad-Shoaib-Resume.pdf" download="Ahmad_Shoaib_CV.pdf" target="_blank" rel="noopener" aria-label="Download résumé (PDF)"><svg class="si" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"></path></svg><span>Résumé</span><svg class="dl" aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg></a>
        </p>
      </div>
      <a class="hi" href="#work" style="--d: 1.45s; display: inline-flex; align-items: center; gap: 12px; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .22em; color: {{accent}}; text-decoration: none">
        <span class="blink" style="width: 2px; height: 20px; background: {{accent}}"></span>
        SEE THE WORK
      </a>
    </div>
  </section>

  <!-- SKILL STRIP -->
  <div class="sk" aria-label="Skills and tools">
    <a class="sk-cue" href="#about" aria-label="Scroll to About"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></a>
    <div class="sk-view">
      <ul class="sk-track">
        <sc-for list="{{ skillStrip }}" as="k" hint-placeholder-count="20">
          <li class="sk-item" aria-hidden="{{ k.dup }}"><span class="sk-b">{{ k.b }}</span>{{ k.t }}</li>
        </sc-for>
      </ul>
    </div>
    <p class="sk-sub"><span>Research</span><i></i><span>Structure</span><i></i><span>Interface</span><i></i><span>Systems</span><i></i><span>Shipped</span></p>
  </div>

  <!-- ABOUT -->
  <section id="about" style="padding: 56px 24px">
    <div style="max-width: 1272px; margin: 0 auto">
      <div class="ab rv">
        <article class="ab-card ab-main">
          <p class="ab-lab">(01) ABOUT</p>
          <p class="ab-lead">I’m a <span class="hw">senior UI/UX designer</span> and <span class="hw">UX engineer</span> in Islamabad. For six years I’ve designed SaaS platforms, fintech apps and e-commerce products for teams in Pakistan, the UK, the US, Indonesia and Denmark.</p>
          <div class="ab-two">
            <p><b>Research first.</b> I prototype early, test with real users, and cover the long flows and edge states nobody else drew.</p>
            <p><b>Built to ship.</b> I work in Webflow, Framer, HTML and CSS, so designs stay realistic and handoff has fewer surprises.</p>
          </div>
          <p class="ab-now"><span class="ab-dot"></span>Now: <b>Senior UI/UX Designer at Teo International</b></p>
        </article>
        <figure class="ab-card ab-pic">
          <img src="assets/2afcfcfa0b7aa6c293d7294ce1debeff.jpg" alt="Ahmad Shoaib" loading="lazy" decoding="async">
          <figcaption><span>Ahmad Shoaib</span><small>Islamabad, PK · UTC+5</small></figcaption>
        </figure>
        <div class="ab-card ab-stat" style="--rd: .05s"><dd class="ct" style="--to: 6">+</dd><dt>Years in product design</dt><span class="ab-bar"><i style="--w: 60%"></i></span></div>
        <div class="ab-card ab-stat" style="--rd: .12s"><dd class="ct" style="--to: 30">+</dd><dt>Products designed and shipped</dt><span class="ab-bar"><i style="--w: 85%"></i></span></div>
        <div class="ab-card ab-stat" style="--rd: .19s"><dd class="ct" style="--to: 10">+</dd><dt>Industries, from SaaS to fintech</dt><span class="ab-bar"><i style="--w: 70%"></i></span></div>
        <div class="ab-card ab-stat" style="--rd: .26s"><dd class="ct" style="--to: 5"></dd><dt>Countries: PK, UK, US, ID, DK</dt><span class="ab-bar"><i style="--w: 55%"></i></span></div>
      </div>
    </div>
  </section>

  <!-- WORK -->
  <section id="work" style="padding: 56px 24px; border-top: 1px solid #222225">
    <div style="max-width: 1272px; margin: 0 auto">
      <div style="display: flex; flex-wrap: wrap; gap: 24px 48px">
        <p style="flex: 0 0 200px; margin: 14px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .12em; color: #85858C">(02) WORK</p>
        <div style="flex: 999 1 600px; min-width: 0">
          <h2 class="sec-h rv" style="margin-bottom: 18px">SELECTED WORK</h2>
          <p class="rv" style="margin: 0; max-width: 560px; color: #A1A1A7; font-size: 17px; line-height: 1.65">Two client projects in depth, from research and structure to the shipped interface, followed by a gallery of product UI and visual explorations.</p>
        </div>
      </div>

      <!-- Featured case study -->
      <article class="feat rv" style="margin-top: 64px; display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: center">
        <a href="veroxos.html" class="feat-m" aria-label="Read the Veroxos portal case study" style="flex: 999 1 560px; min-width: 0; position: relative; display: block; aspect-ratio: 1600 / 1250; border-radius: 16px; overflow: hidden; border: 1px solid #222225; background: #121214">
          <img src="assets/85d4a1a3535f3351f5c2d45d0dd18e43.jpg" alt="Veroxos portal cover: the employee home screen on a laptop" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
          <video class="auto-v" data-src="assets/b49ebde0a02c64dd2d40f4d54d6d1881.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" aria-hidden="true" tabindex="-1" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></video>
        </a>
        <div style="flex: 1 1 360px; min-width: 0">
          <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .12em; color: #85858C"><span style="color: var(--accent)">CASE STUDY 01</span> · VEROXOS · 2025</p>
          <h3 style="margin: 14px 0 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(48px, 5vw, 80px); line-height: .9">PORTAL FOR VEROXOS</h3>
          <p style="margin: 18px 0 0; font-size: 17px; line-height: 1.65; color: #A1A1A7">A self-service web app that shows every employee what their phone costs, what they’re eligible for and where their request is, and gives managers approvals and team reporting in the same place.</p>
          <div style="margin: 24px 0 0; padding: 16px 18px; border: 1px solid #222225; border-radius: 12px; background: #111113; display: flex; gap: 14px; align-items: flex-start">
            <span aria-hidden="true" style="flex: none; margin-top: 2px; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #1C1C1F; color: var(--accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg></span>
            <div><p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #85858C">THE PROBLEM</p><p style="margin: 6px 0 0; font-size: 15px; line-height: 1.55; color: #DCDCE0">Costs lived only in billing reports and every request went through email, so employees had to ask IT for answers they should see themselves.</p></div>
          </div>
          <dl style="margin: 28px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #222225; border-bottom: 1px solid #222225">
            <div style="padding: 18px 12px 18px 0"><dd style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 44px; line-height: .9">70+</dd><dt style="margin-top: 6px; font-size: 13px; color: #A1A1A7">screens</dt></div>
            <div style="padding: 18px 12px; border-left: 1px solid #222225"><dd style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 44px; line-height: .9">12</dd><dt style="margin-top: 6px; font-size: 13px; color: #A1A1A7">flows</dt></div>
            <div style="padding: 18px 0 18px 12px; border-left: 1px solid #222225"><dd style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-size: 44px; line-height: .9">2</dd><dt style="margin-top: 6px; font-size: 13px; color: #A1A1A7">roles, one layout</dt></div>
          </dl>
          <p style="margin: 18px 0 0; font-size: 15px; color: #C5C5CA">Senior UI/UX Designer · Flows, UI, design system, prototypes</p>
          <a class="btnp" href="veroxos.html" style="margin-top: 28px; display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 24px; border: 1px solid #EDEDEE; color: #EDEDEE; font-weight: 600; font-size: 15px; text-decoration: none">Read the case study <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
      </article>

      <article class="feat rev rv" style="margin-top: 64px; display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: center">
        <a href="pamogi.html" class="feat-m" aria-label="Read the Pamogi case study" style="flex: 999 1 560px; min-width: 0; position: relative; display: block; aspect-ratio: 1440 / 1024; border-radius: 16px; overflow: hidden; border: 1px solid #222225; background: #0A0917">
          <img src="assets/15aebe9659fcf46450d0977f16b98e7b.jpg" alt="Pamogi home: a living solar system where every planet is a project" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
          <video class="auto-v" data-src="assets/4b7193f297eccdf613d8d894d5fcdb8f.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" aria-hidden="true" tabindex="-1" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></video>
        </a>
        <div style="flex: 1 1 360px; min-width: 0">
