<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pamogi — Case Study</title>
<meta name="description" content="Case study: Pamogi, by Ahmad Shoaib.">
<meta name="theme-color" content="#0A0A0B">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/pamogi.css">
</head>
<body>
<div id="app"></div>

<!-- Page template: rendered by js/dc-lite.js using the values from js/pamogi.js -->
<script type="text/x-template" id="dc-template">
<div ref="{{ rootRef }}" style="--accent: {{accent}}; background: #0A0917; color: #ECEAF4; font-family: Manrope, system-ui, sans-serif; min-height: 100vh">

  <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(10,9,23,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #24223A">
    <div style="max-width: 1320px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
      <a class="sl back" href="index.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .16em; text-decoration: none">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        ALL WORK
      </a>
      <nav class="chips" aria-label="Case study chapters" style="display: flex; gap: 0 26px">
        <sc-for list="{{ chips }}" as="cp" hint-placeholder-count="5">
          <a class="{{ cp.cls }}" href="{{ cp.href }}" style="position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em">
            <span style="color: {{ cp.numColor }}">{{ cp.num }}</span>{{ cp.label }}
            <span class="bar" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 8px; height: 1px; background: {{accent}}"></span>
          </a>
        </sc-for>
      </nav>
      <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 22px; letter-spacing: .03em; line-height: 1">AHMAD SHOAIB</span>
    </div>
    <div aria-hidden="true" style="height: 2px">
      <div ref="{{ progRef }}" style="height: 2px; width: 0%; background: {{accent}}"></div>
    </div>
  </header>

  <!-- Hero -->
  <section id="top" style="padding: 152px 24px 72px; background: radial-gradient(ellipse 70% 50% at 20% 0%, rgba(98,58,170,.32), transparent 70%)">
    <div style="max-width: 1320px; margin: 0 auto">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px">
        <div style="flex: 999 1 600px; min-width: 0">
          <p style="margin: 0 0 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .16em; color: #8C88A6">PAMOGI · CASE STUDY · UI · UX · ILLUSTRATION · MOTION</p>
          <h1 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(64px, 10.5vw, 176px); line-height: .86; letter-spacing: .005em">A UNIVERSE BUILT<br>AROUND <span style="color: #8BE3CC">PEOPLE.</span></h1>
        </div>
        <p style="flex: 1 1 340px; margin: 0; max-width: 460px; font-size: clamp(17px, 1.45vw, 20px); line-height: 1.6; color: #C9C5DD">Pamogi turns projects into planets. People join as MOGIs, suggest ideas, earn POGI and watch a world grow from rock to living island. I redesigned the web app so that story is visible on every screen, and built the character, worlds and motion that carry it.</p>
      </div>

      <div class="pm-frame" style="margin-top: 56px; position: relative; aspect-ratio: 1440 / 1024; border-radius: 20px; overflow: hidden; border: 1px solid #24223A">
        <img src="assets/15aebe9659fcf46450d0977f16b98e7b.jpg" alt="The redesigned Pamogi home: a living solar system where every planet is a project" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
        <video class="auto-v" data-src="assets/4b7193f297eccdf613d8d894d5fcdb8f.mp4" muted="muted" loop="loop" playsinline="playsinline" preload="none" aria-hidden="true" tabindex="-1" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></video>
      </div>

      <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); border-bottom: 1px solid #24223A">
        <sc-for list="{{ meta }}" as="mt" hint-placeholder-count="4">
          <div style="padding: 24px 24px 24px 0; border-top: 1px solid #24223A">
            <dt style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #8BE3CC">{{ mt.k }}</dt>
            <dd style="margin: 10px 0 0; font-size: 17px; font-weight: 600; line-height: 1.4">{{ mt.v }}</dd>
          </div>
        </sc-for>
      </dl>
    </div>
  </section>

  <!-- Chapters 01–04 -->
  <sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="4">
    <section id="{{ ch.id }}" style="padding: 72px 24px 24px">
      <div style="max-width: 1320px; margin: 0 auto">
        <div class="rv" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 48px; padding-bottom: 32px; border-bottom: 1px solid #24223A; margin-bottom: 32px">
          <div style="display: flex; align-items: baseline; gap: 20px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .12em; color: {{accent}}">({{ ch.num }})</span>
            <h2 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(48px, 6vw, 96px); line-height: .9">{{ ch.titleUp }}</h2>
          </div>
          <p style="margin: 0; max-width: 440px; font-size: 17px; line-height: 1.6; color: #ADA9C4">{{ ch.intro }}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 28px">
          <sc-for list="{{ ch.panels }}" as="pn" hint-placeholder-count="2">
            <sc-if value="{{ pn.isImg }}" hint-placeholder-val="{{ true }}">
              <figure class="rv pm-frame" style="margin: 0; border-radius: 26px; overflow: hidden">
                <img src="{{ pn.src }}" alt="{{ pn.alt }}" width="{{ pn.w }}" height="{{ pn.h }}" loading="{{ pn.loading }}" decoding="async" style="display: block; width: 100%; height: auto">
              </figure>
            </sc-if>
            <sc-if value="{{ pn.isVid }}" hint-placeholder-val="{{ false }}">
              <figure class="rv pm-frame" style="margin: 0; position: relative; border-radius: 26px; overflow: hidden">
                <img src="{{ pn.poster }}" alt="{{ pn.alt }}" width="{{ pn.w }}" height="{{ pn.h }}" loading="{{ pn.loading }}" decoding="async" style="display: block; width: 100%; height: auto">
                <video class="auto-v" data-src="{{ pn.vid }}" muted="muted" loop="loop" playsinline="playsinline" preload="none" aria-hidden="true" tabindex="-1" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></video>
              </figure>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-for>

  <!-- Chapter 05: screens slider -->
  <section id="ch-screens" style="padding: 72px 24px 24px">
    <div style="max-width: 1320px; margin: 0 auto">
      <div class="rv" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 48px; padding-bottom: 32px; border-bottom: 1px solid #24223A; margin-bottom: 32px">
        <div style="display: flex; align-items: baseline; gap: 20px">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .12em; color: {{accent}}">(05)</span>
          <h2 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(48px, 6vw, 96px); line-height: .9">SCREENS</h2>
        </div>
        <p style="margin: 0; max-width: 440px; font-size: 17px; line-height: 1.6; color: #ADA9C4">Thirteen redesigned screens, each shown above the original Figma frame it replaced. Use the tabs or arrows to move between them.</p>
      </div>
      <figure class="rv pm-frame" style="margin: 0 0 28px; border-radius: 26px; overflow: hidden">
        <img src="assets/4adc6c2a45c903ee57f213165bb7e053.jpg" alt="Screens: before and after, screen by screen." width="1400" height="431" loading="lazy" decoding="async" style="display: block; width: 100%; height: auto">
      </figure>

      <div class="rv" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; margin-bottom: 20px">
        <div role="tablist" aria-label="Screens" style="display: flex; gap: 0 22px; overflow-x: auto; max-width: 100%; border-bottom: 1px solid #24223A">
          <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="7">
            <button class="tab" role="tab" aria-selected="{{ tb.sel }}" onClick="{{ tb.go }}" style="flex: none; min-height: 48px; padding: 0 0 2px; margin-bottom: -1px; background: none; border: none; border-bottom: 2px solid {{ tb.line }}; color: {{ tb.color }}; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; white-space: nowrap"><span style="color: {{ tb.numColor }}; margin-right: 6px">{{ tb.num }}</span>{{ tb.label }}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <p aria-live="polite" style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .12em; color: #8C88A6"><span style="color: #ECEAF4">{{ scrNow }}</span> / {{ scrTotal }}</p>
          <button class="pgb" aria-label="Previous screen" onClick="{{ scrPrev }}" disabled="{{ scrAtStart }}" style="width: 48px; height: 48px; display: grid; place-items: center; background: none; border: 1px solid #3A3754; color: #ECEAF4; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          </button>
          <button class="pgb" aria-label="Next screen" onClick="{{ scrNext }}" disabled="{{ scrAtEnd }}" style="width: 48px; height: 48px; display: grid; place-items: center; background: none; border: 1px solid #3A3754; color: #ECEAF4; cursor: pointer">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <div class="scr-view" aria-roledescription="carousel" aria-label="Before and after screens" style="overflow: hidden; border-radius: 26px; transition: height .6s cubic-bezier(.65,0,.25,1); height: {{ scrHeight }}">
        <div class="scr-track" style="display: flex; align-items: flex-start; transform: translateX({{ scrShift }})">
          <sc-for list="{{ slides }}" as="sd" hint-placeholder-count="7">
            <figure class="scr-slide pm-frame" role="group" aria-roledescription="slide" aria-label="{{ sd.label }}" aria-hidden="{{ sd.hidden }}" inert="{{ sd.inert }}" style="flex: 0 0 100%; min-width: 0; margin: 0; border-radius: 26px; overflow: hidden">
              <img src="{{ sd.src }}" alt="{{ sd.alt }}" width="1400" height="{{ sd.h }}" loading="eager" decoding="async" style="display: block; width: 100%; height: auto">
            </figure>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <!-- Chapter 06 -->
  <sc-for list="{{ chapters2 }}" as="ch" hint-placeholder-count="1">
    <section id="{{ ch.id }}" style="padding: 72px 24px 24px">
      <div style="max-width: 1320px; margin: 0 auto">
        <div class="rv" style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 48px; padding-bottom: 32px; border-bottom: 1px solid #24223A; margin-bottom: 32px">
          <div style="display: flex; align-items: baseline; gap: 20px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .12em; color: {{accent}}">({{ ch.num }})</span>
            <h2 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(48px, 6vw, 96px); line-height: .9">{{ ch.titleUp }}</h2>
          </div>
          <p style="margin: 0; max-width: 440px; font-size: 17px; line-height: 1.6; color: #ADA9C4">{{ ch.intro }}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 28px">
          <sc-for list="{{ ch.panels }}" as="pn" hint-placeholder-count="2">
            <sc-if value="{{ pn.isImg }}" hint-placeholder-val="{{ true }}">
              <figure class="rv pm-frame" style="margin: 0; border-radius: 26px; overflow: hidden">
                <img src="{{ pn.src }}" alt="{{ pn.alt }}" width="{{ pn.w }}" height="{{ pn.h }}" loading="{{ pn.loading }}" decoding="async" style="display: block; width: 100%; height: auto">
              </figure>
            </sc-if>
            <sc-if value="{{ pn.isVid }}" hint-placeholder-val="{{ false }}">
              <figure class="rv pm-frame" style="margin: 0; position: relative; border-radius: 26px; overflow: hidden">
                <img src="{{ pn.poster }}" alt="{{ pn.alt }}" width="{{ pn.w }}" height="{{ pn.h }}" loading="{{ pn.loading }}" decoding="async" style="display: block; width: 100%; height: auto">
                <video class="auto-v" data-src="{{ pn.vid }}" muted="muted" loop="loop" playsinline="playsinline" preload="none" aria-hidden="true" tabindex="-1" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></video>
              </figure>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-for>

  <!-- Closing -->
  <section style="padding: 96px 24px 56px">
    <div style="max-width: 1320px; margin: 0 auto; padding-top: 40px; border-top: 1px solid #24223A; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 32px 48px">
      <div>
        <p style="margin: 0 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; color: #8C88A6">THANKS FOR READING</p>
        <h2 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: clamp(56px, 8vw, 128px); line-height: .88">GOT A WORLD<br>TO BUILD?</h2>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center">
        <a class="btnp" href="mailto:ahmadshoaib225@gmail.com" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border: 1px solid #ECEAF4; color: #ECEAF4; font-weight: 600; font-size: 15px; text-decoration: none">Email me</a>
        <a class="sl" href="veroxos.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 8px; font-weight: 600; font-size: 15px">Next: Veroxos portal</a>
        <a class="sl" href="index.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 8px; font-weight: 600; font-size: 15px">All work</a>
        <a class="sl" href="https://dribbble.com/im_ahmad" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 8px; font-weight: 600; font-size: 15px">More on Dribbble <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      </div>
    </div>
    <p style="max-width: 1320px; margin: 48px auto 0; font-size: 14px; color: #8C88A6">© 2026 Ahmad Shoaib</p>
  </section>
</div>
</script>

<script src="js/morphdom.min.js"></script>
<script src="js/dc-lite.js"></script>
<script src="js/pamogi.js"></script>
<script>dcMount(Component, {"accent": "#8BE3CC"});</script>
</body>
</html>
